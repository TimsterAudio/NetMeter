[package]
name = "taw-netmeter"
version = "0.3.0"
edition = "2021"
description = "Timster's Audio Works Net Meter (NM-001): a small desktop monitor of network download and upload rates, Internet and LAN, for Linux and Windows"
authors = ["Timster's Audio Works"]
publish = false

[dependencies]
# The Analyser's and Equaliser's pin: the hifi look
taw-panel = { git = "https://github.com/TimsterAudio/TAW-Panel", rev = "d030ffdbc51c48e784cd74b20c5547a766461e5a" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
